name: Generate Podcast Highlights (DE)

on:
  schedule:
    - cron: '0 8 * * *'    # 08:00 UTC = 10:00 DE
    - cron: '0 12 * * *'   # 12:00 UTC = 14:00 DE
    - cron: '0 17 * * *'   # 17:00 UTC = 19:00 DE
    - cron: '0 21 * * *'   # 21:00 UTC = 23:00 DE
  workflow_dispatch:
    inputs:
      channel:
        description: 'Kanal-Stichwort (leer = zufällig)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: self-hosted   # Mac-Runner mit Wohnungs-IP → kein YouTube Bot-Block
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install/upgrade dependencies
        run: |
          pip3 install yt-dlp --upgrade --quiet
          pip3 install -r requirements.txt --quiet

      - name: Generate podcast highlights
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_STORAGE_NAME: ${{ secrets.BUNNY_STORAGE_NAME }}
          BUNNY_CDN_URL: ${{ secrets.BUNNY_CDN_URL }}
          BUNNY_STORAGE_HOSTNAME: ${{ secrets.BUNNY_STORAGE_HOSTNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 run_local.py "${{ github.event.inputs.channel || '' }}" 2 1
